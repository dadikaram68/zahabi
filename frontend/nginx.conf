# =============================================================================
# FRONTEND NGINX CONFIG
# - Serves the compiled React SPA (dist/public)
# - Reverse-proxies /api/* to the backend service (internal Docker DNS name)
# - SPA fallback: unknown routes return index.html (wouter client routing)
# =============================================================================

upstream backend_api {
    server backend:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 60m;   # keep above the API's 50mb JSON limit

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (mirrors server/_core/index.ts, plus hardening).
    # NOTE: if you embed the app inside an iframe platform, drop X-Frame-Options.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    # Lightweight health endpoint (used by Docker/Compose healthchecks & LBs)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------------------
    # All API traffic -> backend container (never exposed on the host in prod)
    # Covers: /api/trpc/*, /api/scheduled/*, OAuth routes, storage proxy
    # ---------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;   # large JSON payloads / file uploads
        proxy_buffering off;
    }

    # Vite emits content-hashed files under /assets/ -> cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, otherwise deploys serve stale bundles
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
